name: Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MOON_VERSION: "latest"

jobs:
  smoke-example:
    name: Example Smoke (native)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon run examples (three scenes, zero network)
        run: |
          set -euo pipefail
          moon run examples/default-reopen --target native
          moon run examples/host-inject-supersede --target native
          moon run examples/isolation-forget-import --target native
