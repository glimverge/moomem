# Spec: spec/spec-process-cicd-release-pipeline.md
name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
          - alpha
          - beta
      dry_run:
        description: "Skip mooncakes publish, git commit/tag, and GitHub Release (quality + live LLM still run)"
        type: boolean
        default: false

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  MOON_VERSION: "0.1.20260920"
  MODULE_NAME: "heyq02/moomem"

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/test-pipeline.yml

  llm-live:
    name: Live LLM Gate (DeepSeek)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}
          cache: "false"

      - name: Require DeepSeek configuration
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "Missing secret DEEPSEEK_API_KEY" >&2
            missing=1
          fi
          if [[ -z "${DEEPSEEK_BASE_URL:-}" ]]; then
            echo "Missing variable DEEPSEEK_BASE_URL" >&2
            missing=1
          fi
          if [[ -z "${DEEPSEEK_MODEL:-}" ]]; then
            echo "Missing variable DEEPSEEK_MODEL" >&2
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "Configure repo Secrets/Variables before release." >&2
            exit 1
          fi
          # Do not print key; show non-secret config only
          echo "DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}"
          echo "DEEPSEEK_MODEL=${DEEPSEEK_MODEL}"

      - name: Run live LLM gate
        run: |
          set -euo pipefail
          moon run ci/llm_live --target native | tee /tmp/llm-live.log
          grep -q '^LIVE_LLM_PASS$' /tmp/llm-live.log

  release:
    name: Publish mooncakes
    needs: [quality, llm-live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # workflow_dispatch boolean inputs are strings on github.event.inputs
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      BUMP: ${{ github.event.inputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push commit + tag with GITHUB_TOKEN (does not re-trigger workflows).
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MoonBit (no cache)
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}
          cache: "false"

      - name: Bump version
        id: ver
        env:
          BUMP: ${{ env.BUMP }}
        run: |
          set -euo pipefail

          parse_version() {
            local v="$1"
            if [[ "${v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta)\.([0-9]+))?$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              PRE_KIND="${BASH_REMATCH[5]:-}"
              PRE_NUM="${BASH_REMATCH[6]:-0}"
            else
              echo "Unsupported version format: ${v} (want X.Y.Z or X.Y.Z-alpha.N / X.Y.Z-beta.N)" >&2
              exit 1
            fi
          }

          bump_version() {
            local kind="$1"
            case "${kind}" in
              major)
                echo "$((MAJOR + 1)).0.0"
                ;;
              minor)
                echo "${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                echo "${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
              alpha)
                if [[ "${PRE_KIND}" == "alpha" ]]; then
                  echo "${MAJOR}.${MINOR}.${PATCH}-alpha.$((PRE_NUM + 1))"
                elif [[ "${PRE_KIND}" == "beta" ]]; then
                  echo "${MAJOR}.${MINOR}.${PATCH}-alpha.1"
                else
                  echo "${MAJOR}.${MINOR}.$((PATCH + 1))-alpha.1"
                fi
                ;;
              beta)
                if [[ "${PRE_KIND}" == "beta" ]]; then
                  echo "${MAJOR}.${MINOR}.${PATCH}-beta.$((PRE_NUM + 1))"
                elif [[ "${PRE_KIND}" == "alpha" ]]; then
                  echo "${MAJOR}.${MINOR}.${PATCH}-beta.1"
                else
                  echo "${MAJOR}.${MINOR}.$((PATCH + 1))-beta.1"
                fi
                ;;
              *)
                echo "Unknown bump type: ${kind}" >&2
                exit 1
                ;;
            esac
          }

          base_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' moon.mod | head -n1)"
          if [[ -z "${base_version}" ]]; then
            echo "Could not parse version from moon.mod" >&2
            exit 1
          fi
          parse_version "${base_version}"

          new_version="$(bump_version "${BUMP}")"
          is_prerelease=false
          if [[ "${new_version}" == *"-alpha."* || "${new_version}" == *"-beta."* ]]; then
            is_prerelease=true
          fi

          tmp="$(mktemp)"
          sed -E "s/^version[[:space:]]*=[[:space:]]*\"[^\"]+\"/version = \"${new_version}\"/" moon.mod > "${tmp}"
          mv "${tmp}" moon.mod

          echo "Bump ${BUMP}: ${base_version} → ${new_version}"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

      - name: Package module
        run: moon package -v

      - name: Configure mooncakes credentials
        if: env.DRY_RUN != 'true'
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MOONCAKES_TOKEN:-}" ]]; then
            echo "MOONCAKES_TOKEN secret is not set." >&2
            echo "1) Locally: moon login" >&2
            echo "2) Copy full contents of ~/.moon/credentials.json" >&2
            echo "3) GitHub → Settings → Secrets → Actions → MOONCAKES_TOKEN" >&2
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "${MOONCAKES_TOKEN}" > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"

      - name: Verify mooncakes identity
        if: env.DRY_RUN != 'true'
        run: moon whoami

      - name: Publish to mooncakes.io
        if: env.DRY_RUN != 'true'
        run: moon publish -v

      - name: Commit version bump and push tag
        if: env.DRY_RUN != 'true'
        env:
          NEW_VERSION: ${{ steps.ver.outputs.mod_version }}
          BASE_VERSION: ${{ steps.ver.outputs.base_version }}
          BUMP: ${{ env.BUMP }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag="v${NEW_VERSION}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          git add moon.mod
          git commit -m "chore: release ${tag} (${BUMP} from ${BASE_VERSION})"
          git tag "${tag}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${tag}"

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          echo "Dry-run complete for ${MODULE_NAME}@${{ steps.ver.outputs.mod_version }}"
          echo "Would bump: ${{ steps.ver.outputs.base_version }} → ${{ steps.ver.outputs.mod_version }} (${{ env.BUMP }})"
          echo "Skipped: moon publish, git commit/tag, GitHub Release"
          echo "Completed gates: quality + live LLM"

      - name: Cleanup mooncakes credentials
        if: always()
        run: rm -f "$HOME/.moon/credentials.json"

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.mod_version }}
          name: ${{ env.MODULE_NAME }} ${{ steps.ver.outputs.mod_version }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body: |
            Published to mooncakes.io as `${{ env.MODULE_NAME }}@${{ steps.ver.outputs.mod_version }}`.

            Install:
            ```bash
            moon add ${{ env.MODULE_NAME }}@${{ steps.ver.outputs.mod_version }}
            ```
