# Living rules: .trellis/spec/library/quality-guidelines.md (CI iron rules)
name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # Dated CDN pins (e.g. 0.1.20260920) return 403; always install latest.
  MOON_VERSION: "latest"
  # Documented native baseline (core); suite only grows
  NATIVE_TEST_BASELINE: "76"

jobs:
  check:
    name: Static Check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon check (native)
        run: moon check --target native

  test-native:
    name: Test (native)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon test (native)
        run: |
          set -euo pipefail
          # Release quality (workflow_call) stays a plain test. Push/PR collects
          # coverage in this same run so Coveralls does not test native again.
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            moon test --target native | tee /tmp/moon-test.log
          else
            moon test --enable-coverage --target native | tee /tmp/moon-test.log
          fi
          summary="$(grep -E '^Total tests: [0-9]+, passed: [0-9]+, failed: [0-9]+\.?$' /tmp/moon-test.log | tail -n1)"
          test -n "${summary}"
          failed="$(echo "${summary}" | sed -E 's/.*failed: ([0-9]+).*/\1/')"
          passed="$(echo "${summary}" | sed -E 's/.*passed: ([0-9]+).*/\1/')"
          total="$(echo "${summary}" | sed -E 's/.*Total tests: ([0-9]+).*/\1/')"
          echo "target=native total=${total} passed=${passed} failed=${failed}"
          test "${failed}" = "0"
          test "${passed}" = "${total}"
          if [[ "${total}" -lt "${NATIVE_TEST_BASELINE}" ]]; then
            echo "Native suite regressed: expected ≥ ${NATIVE_TEST_BASELINE} tests, got ${total}"
            exit 1
          fi
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            points="$(moon coverage report --ignore-missing-files -f summary -p heyq02/moomem/src | tee /dev/stderr | awk '/^Total: /{print $2}')"
            num="${points%/*}"
            den="${points#*/}"
            echo "src coverage ${num}/${den}"
            if (( num * 100 < den * 90 )); then
              echo "src coverage ${num}/${den} is below 90%"
              exit 1
            fi
            moon coverage report --ignore-missing-files -f coveralls -o coveralls.json -p heyq02/moomem/src
          fi

      - name: Upload coverage report
        if: github.event_name != 'workflow_call'
        uses: actions/upload-artifact@v4
        with:
          name: coveralls
          path: coveralls.json
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon test
        run: |
          set -euo pipefail
          moon test --target "${{ matrix.target }}" | tee /tmp/moon-test.log
          summary="$(grep -E '^Total tests: [0-9]+, passed: [0-9]+, failed: [0-9]+\.?$' /tmp/moon-test.log | tail -n1)"
          test -n "${summary}"
          failed="$(echo "${summary}" | sed -E 's/.*failed: ([0-9]+).*/\1/')"
          passed="$(echo "${summary}" | sed -E 's/.*passed: ([0-9]+).*/\1/')"
          total="$(echo "${summary}" | sed -E 's/.*Total tests: ([0-9]+).*/\1/')"
          echo "target=${{ matrix.target }} total=${total} passed=${passed} failed=${failed}"
          test "${failed}" = "0"
          test "${passed}" = "${total}"

  smoke-example:
    name: Example Smoke (native)
    needs: test-native
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon run examples (three scenes, zero network)
        run: |
          set -euo pipefail
          moon run examples/default-reopen --target native
          moon run examples/host-inject-supersede --target native
          moon run examples/isolation-forget-import --target native

  eval-locomo:
    name: L3 Eval (offline, native)
    needs: test-native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon run benchmark (offline)
        run: moon run benchmark --target native

  coveralls:
    name: Coveralls
    needs: test-native
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coveralls
          path: .

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coveralls.json
          format: coveralls
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
