# Living rules: .trellis/spec/library/quality-guidelines.md (CI iron rules)
# Archived long-form: docs/archive/process-specs/spec-process-cicd-release-pipeline.md
name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
          - alpha
          - beta
      dry_run:
        description: "Skip mooncakes publish, git commit/tag, GitHub Release, and LoCoMo archive (quality + live LLM gate still run)"
        type: boolean
        default: false

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  MOON_VERSION: "latest"
  MODULE_NAME: "heyq02/moomem"

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/test-pipeline.yml

  llm-live:
    name: Live LLM Gate (DeepSeek)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}
          cache: "false"

      - name: Require DeepSeek configuration
        run: bash scripts/ci/require-deepseek-config.sh

      - name: Run live LLM gate
        run: bash scripts/ci/run-llm-live-gate.sh

  release:
    name: Publish mooncakes
    needs: [quality, llm-live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      mod_version: ${{ steps.ver.outputs.mod_version }}
      base_version: ${{ steps.ver.outputs.base_version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    env:
      # workflow_dispatch boolean inputs are strings on github.event.inputs
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      BUMP: ${{ github.event.inputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push commit + tag with GITHUB_TOKEN (does not re-trigger workflows).
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MoonBit (no cache)
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}
          cache: "false"

      - name: Bump version
        id: ver
        run: bash scripts/ci/bump-version.sh

      - name: Package module
        run: moon package -v

      - name: Configure mooncakes credentials
        if: env.DRY_RUN != 'true'
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: bash scripts/ci/configure-mooncakes-credentials.sh

      - name: Verify mooncakes identity
        if: env.DRY_RUN != 'true'
        run: moon whoami

      - name: Publish to mooncakes.io
        if: env.DRY_RUN != 'true'
        run: moon publish -v

      - name: Commit version bump and push tag
        if: env.DRY_RUN != 'true'
        env:
          NEW_VERSION: ${{ steps.ver.outputs.mod_version }}
          BASE_VERSION: ${{ steps.ver.outputs.base_version }}
        run: bash scripts/ci/commit-release-tag.sh

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        env:
          BASE_VERSION: ${{ steps.ver.outputs.base_version }}
          MOD_VERSION: ${{ steps.ver.outputs.mod_version }}
        run: bash scripts/ci/dry-run-summary.sh

      - name: Cleanup mooncakes credentials
        if: always()
        run: rm -f "$HOME/.moon/credentials.json"

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.mod_version }}
          name: ${{ env.MODULE_NAME }} ${{ steps.ver.outputs.mod_version }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body: |
            Published to mooncakes.io as `${{ env.MODULE_NAME }}@${{ steps.ver.outputs.mod_version }}`.

            Install:
            ```bash
            moon add ${{ env.MODULE_NAME }}@${{ steps.ver.outputs.mod_version }}
            ```

  # After a successful publish/tag: archive offline + api LoCoMo scores.
  # Live extraction is local-only (scripts/ci/run-locomo-live-local.sh) — not run in CI.
  # Api gate misses are recorded as fail status but do not fail this job.
  # Process/network errors do fail the job (visible red X) without rolling back publish.
  benchmark-archive:
    name: Archive LoCoMo Benchmark
    needs: release
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      # Prefer MOOMEM_EMBED_*; fall back to QWEN_* mapping inside the archive script.
      MOOMEM_EMBED_API_KEY: ${{ secrets.MOOMEM_EMBED_API_KEY || secrets.QWEN_API_KEY }}
      MOOMEM_EMBED_BASE_URL: ${{ vars.MOOMEM_EMBED_BASE_URL || vars.QWEN_BASE_URL }}
      MOOMEM_EMBED_MODEL: ${{ vars.MOOMEM_EMBED_MODEL || vars.QWEN_MODEL }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL }}
      # Live is not part of the release archive job (run locally + commit).
      SKIP_LIVE: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}
          cache: "false"

      - name: Require embedding API configuration
        run: |
          set -euo pipefail
          if [[ -z "${MOOMEM_EMBED_API_KEY:-}" && -z "${QWEN_API_KEY:-}" ]]; then
            echo "Missing MOOMEM_EMBED_API_KEY / QWEN_API_KEY secret for api-mode archive" >&2
            exit 1
          fi
          if [[ -z "${MOOMEM_EMBED_BASE_URL:-}" && -z "${QWEN_BASE_URL:-}" ]]; then
            echo "Missing MOOMEM_EMBED_BASE_URL / QWEN_BASE_URL var for api-mode archive" >&2
            exit 1
          fi
          if [[ -z "${MOOMEM_EMBED_MODEL:-}" && -z "${QWEN_MODEL:-}" ]]; then
            echo "Missing MOOMEM_EMBED_MODEL / QWEN_MODEL var for api-mode archive" >&2
            exit 1
          fi

      - name: Run LoCoMo archive (offline + api; live skipped)
        env:
          NEW_VERSION: ${{ needs.release.outputs.mod_version }}
          GIT_TAG: v${{ needs.release.outputs.mod_version }}
        run: bash scripts/ci/run-locomo-benchmark-archive.sh

      # GITHUB_TOKEN pushes do not re-trigger workflow runs; dispatch Pages explicitly.
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy Rspress site to Pages" --ref main
