name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MOON_VERSION: "latest"

jobs:
  eval-locomo:
    name: L3 Eval (offline, native)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}

      - name: moon run benchmark (offline)
        run: moon run benchmark --target native
