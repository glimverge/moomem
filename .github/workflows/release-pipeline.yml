# Living rules: .trellis/spec/library/quality-guidelines.md (CI iron rules)
name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
          - alpha
          - beta
      dry_run:
        description: "Skip mooncakes publish, git commit/tag, and GitHub Release (quality gate still runs)"
        type: boolean
        default: false

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  MOON_VERSION: "latest"
  MODULE_NAME: "heyq02/moomem"

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/test-pipeline.yml

  release:
    name: Publish mooncakes
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      mod_version: ${{ steps.ver.outputs.mod_version }}
      base_version: ${{ steps.ver.outputs.base_version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    env:
      # workflow_dispatch boolean inputs are strings on github.event.inputs
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      BUMP: ${{ github.event.inputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push commit + tag with GITHUB_TOKEN (does not re-trigger workflows).
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MoonBit (no cache)
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOON_VERSION }}
          cache: "false"

      - name: Bump version
        id: ver
        run: bash scripts/release/bump-version.sh

      - name: Package module
        run: moon package -v

      - name: Configure mooncakes credentials
        if: env.DRY_RUN != 'true'
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: bash scripts/release/configure-mooncakes-credentials.sh

      - name: Verify mooncakes identity
        if: env.DRY_RUN != 'true'
        run: moon whoami

      - name: Publish to mooncakes.io
        if: env.DRY_RUN != 'true'
        run: moon publish -v

      - name: Commit version bump and push tag
        if: env.DRY_RUN != 'true'
        env:
          NEW_VERSION: ${{ steps.ver.outputs.mod_version }}
          BASE_VERSION: ${{ steps.ver.outputs.base_version }}
        run: bash scripts/release/commit-release-tag.sh

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        env:
          BASE_VERSION: ${{ steps.ver.outputs.base_version }}
          MOD_VERSION: ${{ steps.ver.outputs.mod_version }}
        run: bash scripts/release/dry-run-summary.sh

      - name: Cleanup mooncakes credentials
        if: always()
        run: rm -f "$HOME/.moon/credentials.json"

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.mod_version }}
          name: ${{ env.MODULE_NAME }} ${{ steps.ver.outputs.mod_version }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body: |
            Published to mooncakes.io as `${{ env.MODULE_NAME }}@${{ steps.ver.outputs.mod_version }}`.

            Install:
            ```bash
            moon add ${{ env.MODULE_NAME }}@${{ steps.ver.outputs.mod_version }}
            ```
