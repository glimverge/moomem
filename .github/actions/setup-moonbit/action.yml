name: Setup MoonBit
description: Install MoonBit toolchain (latest), restore caches, refresh registry

inputs:
  version:
    description: Ignored; always installs latest (dated CDN pins currently 403)
    required: false
    default: "latest"
  cache:
    description: Cache ~/.moon and .mooncakes (disable on publish jobs to avoid credential persistence)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Cache MoonBit toolchain
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.moon
        key: moon-${{ runner.os }}-latest
        restore-keys: |
          moon-${{ runner.os }}-

    - name: Cache mooncakes
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: .mooncakes
        key: mooncakes-${{ runner.os }}-${{ hashFiles('moon.mod', 'moon.mod.json') }}
        restore-keys: |
          mooncakes-${{ runner.os }}-

    - name: Install MoonBit toolchain
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: latest
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location \
          https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        moon version --all

    - name: Update package registry
      shell: bash
      run: moon update
