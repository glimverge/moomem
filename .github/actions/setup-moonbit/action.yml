name: Setup MoonBit
description: Install pinned MoonBit toolchain, restore caches, refresh registry

inputs:
  version:
    description: MoonBit toolchain version (MOONBIT_INSTALL_VERSION)
    required: true
  cache:
    description: Cache ~/.moon and .mooncakes (disable on publish jobs to avoid credential persistence)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Cache MoonBit toolchain
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.moon
        key: moon-${{ runner.os }}-${{ inputs.version }}
        restore-keys: |
          moon-${{ runner.os }}-

    - name: Cache mooncakes
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: .mooncakes
        key: mooncakes-${{ runner.os }}-${{ hashFiles('moon.mod', 'moon.mod.json') }}
        restore-keys: |
          mooncakes-${{ runner.os }}-

    - name: Install MoonBit toolchain
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Always invoke installer with pin; cache hits make this a no-op when already matching.
        curl --fail --silent --show-error --location \
          https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        moon version --all
        moon version | grep -F "${{ inputs.version }}"

    - name: Update package registry
      shell: bash
      run: moon update
